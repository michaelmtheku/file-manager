version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - METADATA_FILE=metadata.json
      - UPLOAD_DIR=uploads
    volumes:
      - ./backend:/usr/src/app
      - ./uploads:/usr/src/app/uploads
